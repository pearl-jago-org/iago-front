name: CI_PROMOTE_DEV

on:
  push:
    branches: [ "development" ]
  pull_request:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Angular tests
        run: npm test -- --watch=false --browsers=ChromeHeadless || true

      - name: SonarQube Analysis (JS/TS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: http://sonarqube-local:9000
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=${{ github.event.repository.name }} \
            -Dsonar.sources=src \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.login="$SONAR_TOKEN" \

  security_and_image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # SAST
      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        env:
          HOME: /tmp

      # SCA (Trivy fs)
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scanners: vuln
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1

      # Docker build
      - name: Login GHCR (para poder hacer docker build si usas base image)
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USERNAME --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ github.event.repository.name }}:${{ github.run_number }} .

      # Docker image scan
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.event.repository.name }}:${{ github.run_number }}
          severity: HIGH,CRITICAL
          exit-code: 1

  build-and-promote:
    needs: [sonar, security_and_image]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout front repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # LOGIN GHCR (si usas base image)
      - name: Login to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USERNAME --password-stdin

      # LOGIN ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          IMAGE_URI=058264433602.dkr.ecr.eu-west-1.amazonaws.com/${{ github.event.repository.name }}
          TAG=$(git rev-parse --short HEAD)
          docker build -t $IMAGE_URI:$TAG .

      - name: Push Docker image
        run: |
          IMAGE_URI=058264433602.dkr.ecr.eu-west-1.amazonaws.com/${{ github.event.repository.name }}
          TAG=$(git rev-parse --short HEAD)
          docker push $IMAGE_URI:$TAG

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: pearl-jago-org/argocd
          token: ${{ secrets.GH_PAT }}
          path: gitops
          fetch-depth: 0

      - name: Update image tag in GitOps repo
        run: |
          TAG=$(git rev-parse --short HEAD)
          cd gitops/env/dev/iago-front
          yq -i "
            .images[0].name = \"058264433602.dkr.ecr.eu-west-1.amazonaws.com/iago-front\" |
            .images[0].newTag = \"$TAG\"
          " kustomization.yaml

      - name: Commit and push changes
        run: |
          cd gitops
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Promote iago-front to dev: $TAG" || echo "No changes to commit"
          git push
