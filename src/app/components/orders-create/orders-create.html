<h2>Crear Order</h2>

<form (ngSubmit)="createOrder()">

  <label>Usuario</label>
  <select [(ngModel)]="order.userId" name="userId" required>
    <option *ngFor="let u of users" [value]="u.id">
      {{ u.name }} ({{ u.email }})
    </option>
  </select>

  <label>Producto</label>
  <input [(ngModel)]="order.product" name="product" required />

  <label>Importe</label>
  <input type="number" [(ngModel)]="order.amount" name="amount" required />

  <button type="submit">Crear</button>
</form>
